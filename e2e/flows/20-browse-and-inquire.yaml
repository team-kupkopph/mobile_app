# MONEY PATH 2 · browse adoptable animals → inquire about one.
appId: ph.kupkop.app
---
- runFlow: 00-signin.yaml
- tapOn:
    id: "btn.home.adopt"
- assertVisible:
    id: "screen.adopt"
# ⚠️ Requires the seed to hold at least one listing. If it does not, this fails on a missing
# `card.adopt.0` — which is the correct outcome: an adoption flow with nothing to adopt has
# not been tested, and a flow that skips itself when the fixture is empty is the same
# green-but-checked-nothing failure US-G1 was written about.
- tapOn:
    id: "card.adopt.0"
- assertVisible:
    id: "screen.listingDetail"
- tapOn:
    id: "btn.listingDetail.inquire"
# An alert confirms either outcome — "Inquiry sent" on a fresh one, "Already inquired" when
# this account has inquired before — and while it is up nothing behind it is visible to an
# assertion. Dismiss it, then assert the screen's own copy: the button is replaced by an
# "Inquiry sent" note and a live "See my inquiries", in BOTH cases, so the flow no longer
# depends on whether the fixture account is fresh. Asserting the copy is deliberate: it is the
# signal the POST was accepted rather than merely dispatched.
- tapOn:
    text: "OK"
    optional: true
- assertVisible: "Inquiry sent"

