# MONEY PATH 6 · the owner's own profile.
#
# The third screen that was unverifiable without a person signed in. Short on purpose: what
# it proves is that the "You" tab reaches Profile and the screen renders at all, which is
# exactly what nobody could confirm by hand.
appId: ph.kupkop.app
---
- runFlow: 00-signin.yaml
# The subroutine only proves we left sign-in; the destination is each caller's to assert.
- extendedWaitUntil:
    visible:
      id: "screen.home"
    timeout: 25000
- tapOn:
    id: "tab.profile"
- extendedWaitUntil:
    visible:
      id: "screen.profile"
    timeout: 20000

# SQ5 follow-up · the member shell is ONE tab navigator, so every tab is reachable from every other and a root has nothing
# beneath it. Visit the rest, ending on Home...
- tapOn:
    id: "tab.adopt"
- extendedWaitUntil:
    visible:
      id: "screen.adopt"
    timeout: 20000
- tapOn:
    id: "tab.volunteer"
- extendedWaitUntil:
    visible:
      id: "screen.kawanggawa"
    timeout: 20000

# NT-O1 · there used to be a "back swipe on a root changes nothing" step here. It could not fail: under Maestro the swipe does not
# trigger iOS's interactive back gesture (a positive control, Sign in pushed over guest Home, did not pop at a 1% or a 0% start),
# so it passed whether or not a root had something to pop to. It was removed rather than kept as a green that checks nothing. The
# real check is an OS edge swipe from x = 2 pt on the simulator, done by hand with a positive control (see the test plans).
- tapOn:
    id: "tab.home"
- assertVisible:
    id: "screen.home"
