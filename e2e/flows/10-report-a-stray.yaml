# MONEY PATH 1 · file a report → it appears in My Reports.
#
# This is the path the whole app exists for, and the one Sprint 8 found broken in the most
# ways: the rescue map announcing "No strays reported near Marikina right now" while eight
# sat within 10 km, and ReportDetail telling a rescuer a live case was "not found". A test
# that only checks the POST succeeds would have passed through both.
appId: ph.kupkop.app
---
- runFlow: 00-signin.yaml
- tapOn:
    id: "btn.home.report"
- assertVisible:
    id: "screen.reportStray"
- tapOn:
    id: "field.reportStray.notes"
- inputText: "E2E smoke — limping brown aspin near the covered court."
# ⚠️ NOT `hideKeyboard`. Maestro's dismiss action needs a standard input accessory this
# app's fields do not expose, and it FAILS the flow rather than degrading. Tapping the
# screen's own heading is the documented alternative and is stable: it is static text, so
# there is no risk of activating something. (Found by running it — the YAML parsed fine and
# every selector existed.)
- tapOn:
    id: "screen.reportStray"
# The submit is gated on a GPS fix, so this waits for the button to become live rather than
# racing it. `enabled: true` is the difference between testing the flow and testing a
# stopwatch.
# ⚠️ THE ORIGINAL COMMENT HERE WAS WRONG ABOUT ITS OWN APP. It said `enabled: true` was
# "the difference between testing the flow and testing a stopwatch" — but this button has NO
# `disabled` prop at all (ReportStrayScreen only swaps a style when there is no GPS fix), so
# it is always enabled in the tree and the filter could never distinguish anything. Waiting
# on it simply never matched.
#
# The real gate is inside `submit()`, which returns early without coordinates. So the flow
# waits for the fix to arrive and then presses; if coordinates never come, the assertion
# below fails, which is the correct signal rather than a false pass.
# ⚠️ SCROLL FIRST. The submit sits at the bottom of a ScrollView and is simply off-screen on
# this device, so `assertVisible` fails on a form that is perfectly fine — Maestro asserts
# what is on screen, not what exists in the tree.
- scrollUntilVisible:
    element:
      id: "btn.reportStray.submit"
    direction: DOWN
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "btn.reportStray.submit"
- extendedWaitUntil:
    visible:
      id: "screen.reportSent"
    timeout: 30000
# ⚠️ THE ASSERTION THIS FLOW EXISTS FOR. A queued (offline) report shows "Saved — we'll
# send it" and routes to My Reports instead; a sent one offers "Track this report". If the
# device is online and we still get the queued branch, the report did NOT reach anyone and
# the flow must fail here, not quietly pass. US-O3 is explicit that the success screen must
# not claim rescuers were alerted when nothing was sent.
- assertVisible:
    id: "btn.reportSent.track"
- tapOn:
    text: "Back to home"
- assertVisible:
    id: "screen.home"
- tapOn:
    id: "btn.home.myReports"
- assertVisible:
    id: "screen.myReports"
# The report is actually in the list — the round trip, not just the POST's 201.
#
# ⚠️ BY ID, NOT BY TEXT, AND THIS ONE COST THREE ATTEMPTS. The first version asserted the
# NOTES typed into the form, which this list never renders — a row is
# `sagipTitle(species, condition)` plus city and time. The second asserted that title,
# "Dog · Injured", which the screen was demonstrably displaying — and it still failed.
#
# The pattern across today: every text assertion that failed contained a non-alphanumeric
# character (the `·` here, the apostrophe in "You're offline"), and every one that passed was
# plain ASCII words. So rather than keep guessing at Maestro's text matching, the row carries
# an id — which is what the rest of this suite already does and should have done here.
- assertVisible:
    id: "card.myReports.0"
