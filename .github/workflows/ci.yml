name: mobile

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · jest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9            # pnpm-lock.yaml is lockfileVersion 9.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      # --frozen-lockfile fails if package.json and the lockfile disagree, so a
      # dependency added without committing the lockfile cannot reach main.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TypeScript is currently the only automated guard on ~74 screens.
      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
