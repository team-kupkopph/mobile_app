name: mobile

on:
  push:
    branches: ['**']
  pull_request:
  # US-C2 · manual trigger, so US-E3's release rehearsal can run the pipeline on demand
  # rather than pushing a throwaway commit to provoke it.
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck · jest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9            # pnpm-lock.yaml is lockfileVersion 9.0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      # --frozen-lockfile fails if package.json and the lockfile disagree, so a
      # dependency added without committing the lockfile cannot reach main.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # US-K3 · §12.4 dependency hygiene.
      #
      # THE THRESHOLD IS `critical`, AND THAT IS A COMPROMISE — here is the whole reasoning,
      # because a gate this weak is otherwise indistinguishable from carelessness.
      #
      # The 2026-09-04 baseline was 120 advisories (1 critical, 66 high). Almost all came
      # from the deprecated `expo-cli` devDependency, which no script in this project used;
      # removing it left 27 (0 critical, 17 high). Every remaining high is a BUILD-TIME
      # package pinned inside the Expo SDK's own tree — metro, postcss, browserslist, tar,
      # js-yaml, nanoid, image-size, brace-expansion. None ships in the app binary and none
      # is reachable from our code.
      #
      # Gating at `high` would therefore mean a permanently red pipeline that nobody can fix
      # without forking Expo, and a pipeline nobody can fix is a pipeline that gets deleted —
      # which costs more than it buys. Per-advisory ignores would be the right answer, but
      # pnpm 9.7's `auditConfig.ignoreCves` / `ignoreGhsas` do not affect `pnpm audit`'s exit
      # code (both were tried and neither changed the counts).
      #
      # So: fail on `critical`, and print everything else. The 17 highs are recorded in
      # dev/HANDOFF.md as a tracked acceptance, and the real fix is the next Expo SDK bump,
      # which re-pins that tree. Re-audit after every SDK upgrade.
      - name: Dependency audit
        run: pnpm audit --audit-level critical

      # TypeScript is currently the only automated guard on ~74 screens.
      - name: Typecheck
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
